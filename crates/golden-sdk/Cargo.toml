[package]
name = "golden-sdk"
description = "Переиспользуемый SDK для Gold Client (CS 1.6): смещения, студийные модели, engine_studio_api_t, доступ к рендереру, проекция, хуки."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
retour = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
] }