[package]
name = "golden-inject"
description = "Загрузчик DLL в процесс игры: CreateRemoteThread + LoadLibraryA. Только для отладки своих сборок."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "golden-inject"
path = "src/main.rs"

[dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }