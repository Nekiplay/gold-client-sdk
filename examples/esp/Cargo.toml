[package]
name = "example-esp"
description = "Пример: оверлей скелета моделей игроков (оффлайн/боты). Вся работа с движком — в golden-sdk."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# Хуки объявлены как `thiscall` (соглашение вызовов методов движка), поэтому
# крейт собирается только под i686: `cargo test --workspace` на x64 его не трогает.
test = false
doctest = false

[dependencies]
golden-sdk = { workspace = true }
golden-std = { workspace = true }
windows-sys = { workspace = true }