[package]
name = "example-wallbang"
description = "Пример: урон через стены по игроку под прицелом (оффлайн/боты). Механика — в golden-sdk и golden-std."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# Хуки объявлены как `thiscall` (соглашение вызовов методов движка), поэтому
# крейт собирается только под i686: `cargo test --workspace` на x64 его не трогает.
test = false
doctest = false

[dependencies]
golden-sdk = { workspace = true }
golden-std = { workspace = true }