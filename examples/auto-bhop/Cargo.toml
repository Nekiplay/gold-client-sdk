[package]
name = "example-auto-bhop"
description = "Пример: автобанихоп с заблокированным пробелом — прыжок колесом в окно игры (golden-std)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# Хуки `thiscall` собираются только под i686; на x64 тесты не запускаются.
test = false
doctest = false

[dependencies]
golden-sdk = { workspace = true }
golden-std = { workspace = true }
windows-sys = { workspace = true }