[package]
name = "example-scheduler"
description = "Пример: отложенные консольные команды без блокировки кадра (очередь с дедлайнами из golden-std)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# Хуки `thiscall` собираются только под i686; на x64 тесты не запускаются.
test = false
doctest = false

[dependencies]
golden-sdk = { workspace = true }
golden-std = { workspace = true }
windows-sys = { workspace = true }