[package]
name = "example-aimbot"
description = "Пример: аим на ближайшую часть тела + огонь только под прицелом (оффлайн/боты). Механика — в golden-std."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# Хуки объявлены с соглашениями вызовов движка, поэтому крейт собирается
# только под i686: `cargo test --workspace` на x64 его не трогает.
test = false
doctest = false

[dependencies]
golden-sdk = { workspace = true }
golden-std = { workspace = true }
windows-sys = { workspace = true }
