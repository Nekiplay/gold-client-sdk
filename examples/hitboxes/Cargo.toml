[package]
name = "example-hitboxes"
description = "Пример: хитбоксы тела игрока в момент его отрисовки — те, по которым движок считает попадание выстрела."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# Хуки объявлены как `thiscall` (соглашение вызовов методов движка), поэтому
# крейт собирается только под i686: `cargo test --workspace` на x64 его не трогает.
test = false
doctest = false

[dependencies]
golden-sdk = { workspace = true }
golden-std = { workspace = true }
windows-sys = { workspace = true }